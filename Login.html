<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWR Tracker - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <main class="login-container">
    <div class="card glass login-card">
      <div class="login-header">
    
        <svg class="login-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100">
    <g fill="var(--accent-color, #c581ff)">
      <path d="M 38 46 C 34 46 34 54 38 54 Z" />
      <rect x="42" y="18" width="16" height="64" rx="8" ry="8" />
      <rect x="62" y="6" width="20" height="88" rx="10" ry="10" />
      <text x="160" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="1">PWR TRCKR</text>
      <rect x="238" y="6" width="20" height="88" rx="10" ry="10" />
      <rect x="262" y="18" width="16" height="64" rx="8" ry="8" />
      <path d="M 282 46 C 286 46 286 54 282 54 Z" />
    </g>
  </svg>
  
      </div>

      <form onsubmit="return false;" class="login-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input id="email" type="email" placeholder="ejemplo@correo.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div class="button-group">
          <button type="button" class="btn-primary" onclick="login()">Iniciar sesión</button>
          <button type="button" class="btn-secondary" onclick="register()">Crear cuenta</button>
        </div>
      </form>

      <div class="divider">
        <span>o</span>
      </div>

      <button type="button" class="btn-google" onclick="googleLogin()">
        <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continuar con Google
      </button>
    </div>
  </main>

<script type="module">
import {
  auth,
  provider,
  signInWithPopup,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "./Firebase.js";

window.googleLogin = async () => {
  try {
    await signInWithPopup(auth, provider);
    window.location.href = "dashboard.html";
  } catch(err) {
    alert(err.message);
  }
};

window.register = async () => {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  if (!email || !pass) {
    alert("Por favor introduce un correo y contraseña.");
    return;
  }

  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    window.location.href = "dashboard.html";
  } catch(err) {
    alert(err.message);
  }
};

window.login = async () => {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  if (!email || !pass) {
    alert("Por favor introduce tu correo y contraseña.");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, pass);
    window.location.href = "dashboard.html";
  } catch(err) {
    alert(err.message);
  }
};
</script>

</body>
</html>
